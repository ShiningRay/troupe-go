name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: troupe
          POSTGRES_PASSWORD: troupe
          POSTGRES_DB: troupe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U troupe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TROUPE_PG_URL: postgres://troupe:troupe@127.0.0.1:5432/troupe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: gofmt check
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: examples 冒烟
        run: go run ./examples/cart
      - name: benchmark smoke（数字无意义，仅验证可运行）
        run: go test -bench=. -benchtime=1x -run='^$' .
