name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux：全量验证（含真实 PostgreSQL 用例——service 容器仅 Linux 支持）
  linux:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: troupe
          POSTGRES_PASSWORD: troupe
          POSTGRES_DB: troupe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U troupe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TROUPE_PG_URL: postgres://troupe:troupe@127.0.0.1:5432/troupe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: examples 冒烟
        run: go run ./examples/cart
      - name: benchmark smoke（数字无意义，仅验证可运行）
        run: go test -bench=. -benchtime=1x -run='^$' .

  # Windows：跨平台编译与测试（无 service 容器——PG 用例经 TROUPE_PG_URL 未设置自动跳过）
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: gofmt check
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
